pre-commit:
  piped: true
  jobs:
    - name: generate
      run: pnpm generate >/dev/null
    - name: lint
      group:
        parallel: true
        jobs:
          - name: lint-biome
            run: pnpm lint:biome
          - name: lint-types
            run: pnpm lint:types
          - name: lint-knip
            run: pnpm lint:knip
          - name: lint-examples
            run: pnpm lint:examples
          - name: lint-consumer
            run: pnpm lint:consumer

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
