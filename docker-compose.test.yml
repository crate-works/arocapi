name: arocapi

services:
  test-db:
    image: postgres:18
    restart: always
    ports:
      - 5433:5432
    volumes:
      - test-pg-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: catalog_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "catalog_test"]
      interval: 2s
      timeout: 5s
      retries: 20

  test-opensearch:
    image: opensearchproject/opensearch:3
    container_name: test-opensearch
    environment:
      - cluster.name=test-opensearch-cluster
      - node.name=test-opensearch
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - test-opensearch-data:/usr/share/opensearch/data
    ports:
      - 9201:9200
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  test-pg-data:
  test-opensearch-data: