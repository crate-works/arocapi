services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: spike
    # A 4 GB Pi shares RAM with Node, Oni and the admin UI.
    mem_limit: ${SPIKE_MEM:-1g}
    cpus: ${SPIKE_CPUS:-4}
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - jit=off
    volumes:
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
