name: Test Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: catalog_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      opensearch:
        image: opensearchproject/opensearch:3
        env:
          cluster.name: test-opensearch-cluster
          node.name: test-opensearch
          discovery.type: single-node
          bootstrap.memory_lock: true
          OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m -Dplugins.performance_analyzer.enabled=false
          DISABLE_SECURITY_PLUGIN: true
        ports:
          - 9201:9200
        options: >-
          --health-cmd="curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run generate

      - name: Run database migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: mysql://root:password@localhost:3307/catalog_test

      - name: Lint (biome)
        run: pnpm run lint:biome

      - name: Lint (types)
        run: pnpm run lint:types

      - name: Lint (knip)
        run: pnpm run lint:knip

      - name: Lint (examples)
        run: pnpm run lint:examples

      - name: Lint (consumer types)
        run: pnpm run lint:consumer

      - name: Run unit tests
        run: pnpm run test:ci
        env:
          DATABASE_URL: mysql://root:password@localhost:3307/catalog_test
          OPENSEARCH_URL: http://localhost:9201
          NODE_ENV: test

      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
