name: Test Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: catalog_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d catalog_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

      opensearch:
        image: opensearchproject/opensearch:3
        env:
          cluster.name: test-opensearch-cluster
          node.name: test-opensearch
          discovery.type: single-node
          bootstrap.memory_lock: true
          OPENSEARCH_JAVA_OPTS: -Xms256m -Xmx256m -Dplugins.performance_analyzer.enabled=false
          DISABLE_SECURITY_PLUGIN: true
        ports:
          - 9201:9200
        options: >-
          --health-cmd="curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval=30s
          --health-timeout=10s
          --health-retries=3

      s3:
        image: versity/versitygw:v1.9.0
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp
          VGW_HEALTH: /health
          ROOT_ACCESS_KEY: test-access-key
          ROOT_SECRET_KEY: test-secret-key
        ports:
          - 7070:7070
        options: >-
          --health-cmd="wget -q -O /dev/null http://localhost:7070/health"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run generate

      - name: Run database migrations
        run: pnpm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/catalog_test

      - name: Check migrations match the schema
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma --exit-code
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/catalog_test

      - name: Lint (biome)
        run: pnpm run lint:biome

      - name: Lint (types)
        run: pnpm run lint:types

      - name: Lint (knip)
        run: pnpm run lint:knip

      - name: Lint (examples)
        run: pnpm run lint:examples

      - name: Lint (consumer types)
        run: pnpm run lint:consumer

      - name: Run unit tests
        run: pnpm run test:ci
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/catalog_test
          OPENSEARCH_URL: http://localhost:9201
          NODE_ENV: test

      - name: Report Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
